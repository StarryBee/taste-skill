<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avakin Life — Community Report</title>
  <meta name="description" content="An independent community accountability site covering Avakin Life by Lockwood Publishing. Player issues, reviews, suggestions, and transparency tracking." />
  <meta property="og:title" content="Avakin Life — Community Report" />
  <meta property="og:description" content="An independent community accountability site covering Avakin Life by Lockwood Publishing. Player issues, reviews, suggestions, and transparency tracking." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="images/og-preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="images/og-preview.png" />
  <meta name="twitter:title" content="Avakin Life — Community Report" />
  <meta name="twitter:description" content="An independent community accountability site covering Avakin Life by Lockwood Publishing." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>" />
  <style>
    :root {
      --bg:      #f5f2ed;
      --surface: #ffffff;
      --ink:     #1c1917;
      --mid:     #6b5c4c;
      --light:   #c9bfb2;
      --accent:  #8b6e14;
      --red:     #9b2020;
      --border:  #e2d9ce;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
    img { display: block; width: 100%; }
    a { color: var(--accent); }

    /* ── TOPBAR ────────────────────────────────────── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 200; }
    .topbar__inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; }
    .topbar__brand {
      font-family: var(--serif); font-size: 1.1rem; font-weight: 700;
      letter-spacing: -.01em; color: var(--ink); white-space: nowrap;
      padding: 0; cursor: pointer; text-decoration: none; display: block;
    }
    .topbar__brand span { color: var(--accent); }
    .nav { display: flex; gap: 2px; overflow-x: auto; padding: 6px 16px 8px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav__btn {
      background: none; border: none; font-family: var(--sans); font-size: .82rem;
      color: var(--mid); padding: 6px 12px; cursor: pointer; border-radius: 4px;
      transition: background .15s, color .15s; white-space: nowrap; flex-shrink: 0;
    }
    .nav__btn:hover { background: var(--bg); color: var(--ink); }
    .nav__btn.active { background: var(--ink); color: #fff; }
    /* (desktop layout handled in the RESPONSIVE block below) */

    /* ── HAMBURGER (mobile only) ─────────────────── */
    .nav-hamburger { display: none; }
    @media (max-width: 639px) {
      .nav-hamburger {
        display: flex; align-items: center; justify-content: center;
        background: none; border: none; cursor: pointer; color: var(--mid);
        padding: 5px 7px; border-radius: 4px; transition: all .15s;
      }
      .nav-hamburger:hover { background: var(--bg); color: var(--ink); }
      .nav { display: none; flex-direction: column; gap: 0; padding: 4px 8px 10px; }
      .nav.nav--open { display: flex; }
      .nav__btn { text-align: left; border-radius: 6px; padding: 10px 14px; font-size: .88rem; }
    }

    /* ── LAYOUT ────────────────────────────────────── */
    .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }
    .page { display: none; }
    .page.active { display: block; }

    /* ── DECO ───────────────────────────────────────── */
    .deco { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 36px; display: block; }
    .deco--short { height: 170px; }

    /* ── TYPOGRAPHY ────────────────────────────────── */
    .page-title { font-family: var(--serif); font-size: clamp(1.6rem,4vw,2.2rem); font-weight: 700; line-height: 1.2; margin-bottom: 8px; letter-spacing: -.02em; }
    .page-sub { font-size: .95rem; color: var(--mid); margin-bottom: 32px; line-height: 1.65; }
    .page-sub p { margin: 0 0 14px; }
    .page-sub p:last-child { margin-bottom: 0; }
    .page-sub__note { font-size: .88rem; color: var(--mid); opacity: .82; }
    .label { font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; display: block; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    .section-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    /* ── HOME CARDS ────────────────────────────────── */
    .home-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    .intro-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 22px 24px; }
    .intro-card__title { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
    .intro-card__body { font-size: .87rem; color: var(--mid); line-height: 1.65; }
    .summary-list { display: flex; flex-direction: column; gap: 8px; }
    .summary-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 16px 20px; display: flex; gap: 16px; align-items: flex-start;
      cursor: pointer; transition: box-shadow .15s;
    }
    .summary-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .summary-item__icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 2px; }
    .summary-item__title { font-weight: 600; font-size: .93rem; margin-bottom: 3px; }
    .summary-item__desc { font-size: .83rem; color: var(--mid); line-height: 1.55; }
    .summary-item__tag { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--red); margin-top: 5px; }

    /* ── BADGES ───────────────────────────────────────── */
    .badge { font-size: .67rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .badge--red    { background: #fde8e8; color: var(--red); }
    .badge--amber  { background: #fef3dc; color: #8b5c00; }
    .badge--green  { background: #e6f4ea; color: #276c34; }
    .badge--blue   { background: #e8f0fe; color: #1a56a8; }
    .badge--grey   { background: #f0ece8; color: var(--mid); }
    .badge--orange { background: #fff0e0; color: #7a3b00; }

    /* ── ISSUE FILTER ────────────────────────────────── */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .filter-btn {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      font-size: .78rem; padding: 5px 14px; cursor: pointer; color: var(--mid);
      transition: all .15s; font-family: var(--sans);
    }
    .filter-btn:hover { border-color: var(--ink); color: var(--ink); }
    .filter-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* ── ARTICLES ────────────────────────────────────── */
    .article-list { display: flex; flex-direction: column; gap: 24px; }
    .article { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .article[data-hidden="true"] { display: none; }
    .article__header { padding: 22px 26px 0; }
    .article__meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .article__title { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; line-height: 1.3; margin-bottom: 6px; }
    .article__deck { font-size: .88rem; color: var(--mid); font-style: italic; line-height: 1.55; padding-bottom: 16px; }
    .article__body { padding: 0 26px 20px; font-size: .9rem; color: #3a3028; line-height: 1.78; }
    .article__body p { margin-bottom: .95em; }
    .article__body p:last-child { margin-bottom: 0; }
    .callout {
      border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 6px 6px 0;
      padding: 13px 18px; font-size: .87rem; color: var(--mid); line-height: 1.6; margin: 18px 0;
    }
    .callout strong { color: var(--ink); }
    .article__source {
      margin: 0 26px 20px; padding: 10px 14px; background: var(--bg);
      border-left: 3px solid var(--light); border-radius: 0 4px 4px 0;
      font-size: .77rem; color: var(--mid); line-height: 1.55;
    }
    .article__source strong { color: var(--ink); }
    /* editor note (admin) */
    .editor-note {
      margin: 0 26px 20px; padding: 12px 16px;
      background: #fffbea; border: 1px solid #e8d870; border-radius: 6px;
      font-size: .82rem; color: #6b5800; line-height: 1.6;
    }
    .editor-note__label { font-weight: 700; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
    .editor-note__delete { float: right; cursor: pointer; font-size: .8rem; opacity: .5; }
    .editor-note__delete:hover { opacity: 1; }
    /* admin article controls */
    .article__admin-bar {
      display: none; padding: 10px 26px 14px; border-top: 1px dashed var(--border);
      gap: 8px; flex-wrap: wrap;
    }
    .article__admin-bar.visible { display: flex; }
    .admin-btn {
      font-size: .75rem; padding: 4px 10px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--mid);
      font-family: var(--sans); transition: all .15s;
    }
    .admin-btn:hover { background: var(--bg); color: var(--ink); }

    /* ── NOTICE ──────────────────────────────────────── */
    .notice {
      border: 1px solid var(--border); border-left: 3px solid var(--accent);
      background: var(--surface); border-radius: 0 6px 6px 0;
      padding: 13px 18px; font-size: .84rem; color: var(--mid); line-height: 1.6; margin-bottom: 24px;
    }
    .notice strong { color: var(--ink); }
    .notice--warn { border-left-color: var(--red); }

    /* ── REVIEWS ─────────────────────────────────────── */
    .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
    .review-card__stars { color: #c89000; font-size: .9rem; margin-bottom: 6px; }
    .review-card__stars--low { color: var(--red); }
    .review-card__text { font-size: .87rem; line-height: 1.65; color: #3a3028; font-style: italic; margin-bottom: 10px; }
    .review-card__meta { font-size: .74rem; color: var(--mid); }
    .rating-summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; display: flex; gap: 32px; align-items: center; }
    .rating-big { font-family: var(--serif); font-size: 3.5rem; font-weight: 700; line-height: 1; }
    /* .rating-stars removed — class unused in HTML (Bug 13 cleanup) */
    .rating-count { font-size: .78rem; color: var(--mid); }
    .rating-bars { flex: 1; }
    .rbar { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .rbar__label { font-size: .77rem; color: var(--mid); width: 28px; text-align: right; }
    .rbar__track { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .rbar__fill { height: 100%; background: #c89000; border-radius: 4px; }
    .rbar__pct { font-size: .74rem; color: var(--mid); width: 32px; }

    /* ── SUGGESTIONS ─────────────────────────────────── */
    .suggestion-tag-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .suggestion-list { display: flex; flex-direction: column; gap: 12px; }
    .suggestion-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 18px 20px;
    }
    .suggestion-card[data-hidden="true"] { display: none; }
    .suggestion-card--pinned { border-color: var(--accent); }
    /* ── VOTE PANEL ────────────────────── */
    .vote-panel {
      border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px;
    }
    .vote-panel__label {
      font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--mid); display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .vote-panel__label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .vote-result {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .vote-result__for   { font-size: .72rem; font-weight: 700; color: #276c34; min-width: 52px; }
    .vote-result__track { flex: 1; height: 5px; background: #fde8e8; border-radius: 2px; overflow: hidden; }
    .vote-result__fill  { height: 100%; background: #3a8c4a; border-radius: 2px; transition: width .3s; }
    .vote-result__against { font-size: .72rem; font-weight: 700; color: var(--red); min-width: 52px; text-align: right; }
    [data-theme="dark"] .vote-result__track  { background: rgba(224,96,96,.18); }
    [data-theme="dark"] .vote-result__for    { color: #5ab870; }
    .vote-bar {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px;
    }
    .vbtn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 3px;
      cursor: pointer; font-family: var(--serif); font-size: .77rem; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase;
      background: var(--surface); color: var(--mid); transition: all .15s;
    }
    .vbtn:hover { border-color: var(--ink); color: var(--ink); background: var(--bg); }
    .vbtn--up   { justify-content: flex-start; }
    .vbtn--down { justify-content: flex-end; }
    .vbtn--neut { padding: 9px 12px; font-size: .68rem; border-style: dashed; }
    .vbtn--up.active   { background: #1a3a1e; border-color: #1a3a1e; border-style: solid; color: #d4edda; }
    .vbtn--neut.active { background: var(--mid); border-color: var(--mid); border-style: solid; color: var(--surface); }
    .vbtn--down.active { background: #4a0e0e; border-color: #4a0e0e; border-style: solid; color: #fde8e8; }
    [data-theme="dark"] .vbtn--up.active   { background: #1e4024; border-color: #3a8c4a; color: #a3d9a8; }
    [data-theme="dark"] .vbtn--down.active { background: #3a0e0e; border-color: #c04040; color: #f5b8b8; }
    .vbtn__count { font-family: var(--sans); font-size: .68rem; font-weight: 700; opacity: .75; }
    .vbtn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .vbtn.active:disabled { opacity: .85; }
    .vote-done { font-size: .7rem; color: var(--mid); text-align: center; padding-top: 8px; font-style: italic; letter-spacing: .04em; }
    .suggestion-card__content { min-width: 0; }
    .suggestion-card__title { font-weight: 600; font-size: .93rem; margin-bottom: 5px; line-height: 1.35; }
    .suggestion-card__desc { font-size: .84rem; color: var(--mid); line-height: 1.6; margin-bottom: 8px; }
    .suggestion-card__footer { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag {
      font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 3px; background: var(--bg); color: var(--mid);
      border: 1px solid var(--border);
    }
    .suggestion-admin { display: none; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .suggestion-admin.visible { display: flex; }
    .submit-btn {
      margin-top: 20px; padding: 11px 22px; background: var(--ink); color: #fff;
      border: none; border-radius: 6px; font-family: var(--sans); font-size: .88rem;
      font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .85; }
    .submit-btn--outline { background: none; color: var(--ink); border: 1px solid var(--border); }
    .submit-btn--outline:hover { background: var(--bg); opacity: 1; }
